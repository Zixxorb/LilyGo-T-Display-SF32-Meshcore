; Vesper for the LilyGo T-Deck (ESP32-S3). Build: ./build.sh, flash: ./flash.sh, serial: ./monitor.sh
;
; MeshCore itself (../lib/MeshCore, fetched by ../setup.sh) is compiled unmodified, like the SF32
; build: build_src_filter below picks its core, the helpers an ESP32 companion uses, its bundled
; ed25519 and the companion_radio example. Our own code is ../src/tdeck (board, radio, target).
; Pins and radio settings follow MeshCore's variants/lilygo_tdeck.

[platformio]
src_dir = ../src/tdeck
boards_dir = ../lib/MeshCore/boards
default_envs = tdeck_companion

[env:tdeck_companion]
platform = platformio/espressif32@6.11.0
board = t-deck
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; (no upload_port: flash.sh finds the T-Deck by its USB id, so the SF32 board is never flashed)
lib_deps =
  SPI
  Wire
  FS
  SPIFFS
  ESP32 BLE Arduino
  ; the RadioLib commit MeshCore v1.18 pins
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  densaugeo/base64 @ ~1.4.0
build_flags =
  -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D ESP32_PLATFORM
  -D VESPER_TDECK
  -I ../src/tdeck
  -I ../src/tdeck/compat
  -I ../src/platform
  -I ../lib/MeshCore/src
  -I ../lib/MeshCore/lib/ed25519
  -I ../lib/MeshCore/examples/companion_radio
  ; MeshCore "USA/Canada" preset (a fresh node only: saved settings win)
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  ; the board
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
  -D PIN_USER_BTN=0          ; trackball click
  -D PIN_PERF_POWERON=10     ; powers the keyboard, screen backlight, SD, amp, trackball
  -D PIN_TFT_CS=12
  -D PIN_SD_CS=39
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45
  -D P_LORA_NSS=9
  -D P_LORA_RESET=17
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=38
  -D P_LORA_MOSI=41
  -D ENV_INCLUDE_GPS=0       ; the original T-Deck has no GPS
  ; MeshCore's companion_radio
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D BLE_PIN_CODE=123456
build_src_filter =
  +<*>
  +<../platform/SF32Display.cpp>
  +<../../lib/MeshCore/src/*.cpp>
  +<../../lib/MeshCore/src/helpers/*.cpp>
  +<../../lib/MeshCore/src/helpers/radiolib/*.cpp>
  +<../../lib/MeshCore/src/helpers/esp32/SerialBLEInterface.cpp>
  +<../../lib/MeshCore/src/helpers/ui/MomentaryButton.cpp>
  +<../../lib/MeshCore/lib/ed25519/*.c>
  +<../../lib/MeshCore/examples/companion_radio/main.cpp>
  +<../../lib/MeshCore/examples/companion_radio/MyMesh.cpp>
  +<../../lib/MeshCore/examples/companion_radio/DataStore.cpp>

; Debug firmware: adds screenshots over USB (shot.py). Never for normal use: the user's rule is
; that screenshots and remote control stay in debug builds.   ./build.sh -e tdeck_debug
[env:tdeck_debug]
extends = env:tdeck_companion
build_flags =
  ${env:tdeck_companion.build_flags}
  -D TDECK_SHOT
