name: Build firmware

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']  # no firmware to build for a docs change
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # the SDKs and the toolchain are big and change only when ci/pins.sh does:
      # keep them between runs
      - uses: actions/cache@v6
        with:
          path: |
            .ci
            ~/.sifli
          key: sdk-${{ hashFiles('ci/pins.sh') }}

      - name: Build companion, repeater, room server
        run: ci/build-all.sh

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/*
