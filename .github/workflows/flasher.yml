name: Flasher checks

# Everything but the flash itself, on the systems nobody here has to hand. Mac runners use
# private-repo minutes quickly, so only when the flasher changes (or by hand).
on:
  push:
    branches: [main]
    paths: ['flasher/**', 'ci/test-flasher.py', '.github/workflows/flasher.yml']
  pull_request:
    paths: ['flasher/**', 'ci/test-flasher.py', '.github/workflows/flasher.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: '3.x' }
          - { os: windows-latest, python: '3.8' }  # the oldest the flasher says it supports
          - { os: macos-latest, python: '3.x' }    # Apple silicon
          - { os: macos-15-intel, python: '3.x' }
          - { os: ubuntu-24.04, python: '3.x' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pyserial
      - run: python ci/test-flasher.py
