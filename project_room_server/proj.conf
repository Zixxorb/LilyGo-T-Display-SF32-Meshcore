# --- C++ (MeshCore is C++) ---
CONFIG_RT_USING_CPLUSPLUS=y

# --- Threads: the default 2 KB main stack is too small for Ed25519/X25519 math ---
CONFIG_RT_MAIN_THREAD_STACK_SIZE=16384

# --- Storage: littlefs on the FS_REGION flash partition (see src/arduino/FS.cpp) ---
CONFIG_RT_USING_LITTLE_FS=y

# --- Console: 115200 baud, as MeshCore's serial CLI and config.meshcore.io expect.
# The msh shell is off so MeshCore owns console input.
CONFIG_RT_SERIAL_DEFAULT_BAUDRATE=115200
# CONFIG_RT_USING_FINSH is not set

# --- Battery voltage (GPADC "bat1") ---
CONFIG_BSP_USING_ADC1=y

# --- Hardware watchdog: the SDK starts it at boot (fed from idle); SF32Board takes
# over and feeds it from MeshCore's loop, so a stuck loop reboots the board. ---
CONFIG_BSP_USING_WDT=y
CONFIG_WDT_TIMEOUT=30

# --- Logging (filtered to warnings at runtime in the repeater build) ---
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_FILTER=y
CONFIG_ULOG_BACKEND_USING_CONSOLE=y
CONFIG_ULOG_OUTPUT_THREAD_NAME=y

# --- LoRa: SX1262 on SPI1 via LilyGo's C RadioLib port ---
CONFIG_BSP_USING_SPI1=y
CONFIG_PKG_USING_RADIOLIB=y
CONFIG_RADIOLIB_USING_SX1262=y
CONFIG_RADIOLIB_DEFAULT_FREQUENCY=910525000
CONFIG_RADIOLIB_SX1262_USE_DCDC=y
CONFIG_RADIOLIB_SX1262_USE_DIO2_RF_SWITCH=y
CONFIG_RADIOLIB_SX1262_TCXO_VOLTAGE_MV=3000
CONFIG_RADIOLIB_T_DISPLAY_SF32_PINMUX=y
# CONFIG_RADIOLIB_USING_SAMPLES is not set
